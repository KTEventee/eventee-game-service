version: "3.8"

services:
  redis:
    image: redis:7.2
    container_name: local-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no

  mysql:
    image: mysql:8.0
    container_name: eventee-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventee
      MYSQL_USER: eventee
      MYSQL_PASSWORD: eventee
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: